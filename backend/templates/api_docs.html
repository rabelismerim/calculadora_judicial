{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <title>JUCA Api Documentation</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--    <link rel="stylesheet" type="text/css" href="//unpkg.com/swagger-ui-dist@3/swagger-ui.css"/>-->
    <link rel="stylesheet" type="text/css" href="{% static 'swagger-ui.css' %}"/>
</head>
<body>
<div style="padding: 20px 0 10px 38px">
    {% if request.user.is_authenticated %}
    <form method="post" action="/djud/logout/">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
    {% else %}
    <form method="post" action="/djud/login/">
        {% csrf_token %}
        <input type="text" name="username" placeholder="digite o username..."/>
        <input type="password" name="password" placeholder="digite a senha..."/>
        <button type="submit">Login</button>
    </form>
    {% endif %}
</div>
<div id="swagger-ui"></div>
<!--<script src="//unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js"></script>-->
<script src="{% static 'swagger-ui-bundle.js' %}"></script>

<script>
    const ui = SwaggerUIBundle({
        url: "{% url schema_url %}",
        dom_id: '#swagger-ui',
        presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        requestInterceptor: (request) => {
            request.headers['X-CSRFToken'] = "{{ csrf_token }}"
            return request;
        }
    })

    function alterarTagP() {
  const tagP = document.querySelector(".renderedMarkdown > p");
  tagP.textContent = "Novo valor da tag P";
}
document.addEventListener("DOMContentLoaded", function() {
  let tagP = null;

// Cria um intervalo que verifica se a tag já foi carregada
const intervalo = setInterval(function() {
  // Verifica se a tag já foi carregada
  tagP = document.querySelector(".renderedMarkdown > p");
  if (tagP) {
    // Se a tag já foi carregada, atualiza seu conteúdo e limpa o intervalo

    tagP.textContent = '{% trans "System that integrates the legal, calculation and  financial teams of RJ / Bankruptcy processes (liabilities monitoring)" %}';
    clearInterval(intervalo);
  }
}, 100); // A cada 100ms, verifica se aSomething went wrong. Please try again later.
});

</script>
</body>
</html>
