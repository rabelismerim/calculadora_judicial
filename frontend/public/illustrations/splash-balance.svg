<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 674 674" class="splash-balance">
  <style>
    .rafter {
      --r: -25deg;
      --t: 10s;
      transform: rotate(var(--r)); 
      transform-origin: 50% 25%;
      transition: all 300ms ease-in-out;
    }
    .plate {
      --pr: calc(-1 * var(--r));
      transform-origin: 15% 3%;
      transition: all .4s ease-in-out;
      transform: translate(var(--px), 22%) rotate(var(--pr))
    }
    .plate-left {
      --px: 8%
    }
    .plate-right {
      --px: 62%;
    }
    .rafter {
      animation: rb var(--t) ease-in-out infinite;
    }
    .plate {
      animation: pb var(--t) ease-in-out infinite;
    }
    .star {
      --t: 2s;
      animation: s var(--t) ease-in-out infinite;
    }
    @keyframes rb {
      0% {
        transform: rotate(-25deg);
      }
      50% {
        transform: rotate(25deg);
      }
      100% {
        transform: rotate(-25deg);
      }
    }
    @keyframes pb {
      0% {
        transform: translate(var(--px), 22%) rotate(25deg);
      }
      50% {
        transform: translate(var(--px), 22%) rotate(-25deg);
      }
      100% {
        transform: translate(var(--px), 22%) rotate(25deg);
      }
    }
    @keyframes s {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
