# Python Django
# Test a Django project on multiple versions of Python.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python
trigger:
- main


pool:
  vmImage: ubuntu-latest
strategy:
  matrix:
    DJUD:
      PYTHON_VERSION: '3.9'
  maxParallel: 3

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(PYTHON_VERSION)'
    architecture: 'x64'
- task: NodeTool@0
  inputs:
    versionSource: 'spec'
    versionSpec: '8.x'
- task: DownloadSecureFile@1
  name: EnvDev
  inputs:
    secureFile: '.env'
- script: |
    echo Installing $(EnvDev.secureFilePath) to the path backend...
    sudo chown root:root $(EnvDev.secureFilePath)
    sudo cp $(EnvDev.secureFilePath) $(Build.SourcesDirectory)/backend 
- task: PythonScript@0
  displayName: 'Export project path'
  inputs:
    scriptSource: 'inline'
    script: |
      """Search all subdirectories for `manage.py`."""
      from glob import iglob
      from os import path
      # Python >= 3.9
      manage_py = next(iglob(path.join('**', 'manage.py'), recursive=True), None)
      if not manage_py:
          raise SystemExit('Could not find a Django project')
      project_location = path.dirname(path.abspath(manage_py))
      print('Found Django project in', project_location)
      print('##vso[task.setvariable variable=projectRoot]{}'.format(project_location))

- script: |
    npm install
    npm run build
  workingDirectory: $(Build.SourcesDirectory)/frontend
  displayName: 'Install node prerequisites'

- script: |
    python -m pip install --upgrade pip setuptools wheel
    pip install virtualenv
    virtualenv venv
    python -m pip install --upgrade pip setuptools wheel
    pip install -r requirements.txt
    pip install unittest-xml-reporting
    pip install fastcgi
    python manage.py makemigrations
    python manage.py migrate
    python manage.py collectstatic
  workingDirectory: $(Build.SourcesDirectory)/backend
  displayName: 'Install and preparing python prerequisites'
