# Python Django
# Test a Django project on multiple versions of Python.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python
trigger:
  - hml
pool:
  name: TR_UAT
  demands:
    - Agent.Name -equals TRUAT
variables:
  system.debug: 'true'
strategy:
  matrix:
    DJUD:
      PYTHON_VERSION: '3.9.10'
  maxParallel: 3
steps:
  - task: NodeTool@0
    inputs:
      versionSource: 'spec'
      versionSpec: '18.x'
      checkLatest: true
  - task: DownloadSecureFile@1
    name: Env
    inputs:
      secureFile: '.juca-hml.env'
  - task: DownloadSecureFile@1
    name: EnvFrontEnd
    inputs:
      secureFile: '.env-frontend-hml'
  - script: |
      echo Installing $(Env.secureFilePath) to the path backend...
      copy $(Env.secureFilePath) $(Build.SourcesDirectory)\backend\.env
    failOnStderr: true
  - script: |
      echo Installing $(EnvFrontEnd.secureFilePath) to the path frontend...
      copy $(EnvFrontEnd.secureFilePath) $(Build.SourcesDirectory)\frontend\.env
    failOnStderr: true
  - task: PythonScript@0
    displayName: 'Export project path'
    inputs:
      scriptSource: 'inline'
      script: |
        """Search all subdirectories for `manage.py`."""
        from glob import iglob
        from os import path
        # Python >= 3.9.10
        manage_py = next(iglob(path.join('**', 'manage.py'), recursive=True), None)
        if not manage_py:
            raise SystemExit('Could not find a Django project')
        project_location = path.dirname(path.abspath(manage_py))
        print('Found Django project in', project_location)
        print('##vso[task.setvariable variable=projectRoot]{}'.format(project_location))
  - script: |
      npm install
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/frontend
    displayName: 'Install node prerequisites'
  - script: |
      npm run build:prod
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/frontend
    displayName: 'Run npm build'
  - script: |
      md .\log
    failOnStderr: true
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Create dir log'
  - script: |
      pip install virtualenv --user
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Install virtualenv'
  - script: |
      virtualenv venv
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Create virtualenv'
  - script: |
      .\venv\Scripts\activate
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Activate virtualenv'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python -m pip install --upgrade pip setuptools wheel
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Install  pip setuptools wheel'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python -m pip install -r requirements.txt
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Install pip requirements'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python -m pip install unittest-xml-reporting
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Install pip unittest-xml-reporting'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python -m pip install fastcgi wfastcgi
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Install pip fastcgi'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python manage.py collectstatic --no-input
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Django collectstatic'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python manage.py makemigrations
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Django makemigrations'
  - script: |
      $(Build.SourcesDirectory)/backend/venv/Scripts/python manage.py migrate
    failOnStderr: false
    workingDirectory: $(Build.SourcesDirectory)/backend
    displayName: 'Django migrate'
  - task: DeleteFiles@1
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/backend/__pycache__'
      Contents: '**'
      RemoveSourceFolder: true
  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/backend'
      Contents: |
        **/*
        !**/__pycache__/**
        !**/venv/**
      TargetFolder: 'E:\inetpub\wwwroot\uat.fadigitallab.deloitte.com.br\juca'
      OverWrite: true
      flattenFolders: false
      ignoreMakeDirErrors: true
      ignoreErrors: true
    displayName: 'Copy files ignoring venv'
  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/backend/venv'
      Contents: |
        **/*
        !**/__pycache__/**
      TargetFolder: 'E:\inetpub\wwwroot\uat.fadigitallab.deloitte.com.br\juca\venv'
      OverWrite: false
      flattenFolders: false
      ignoreMakeDirErrors: true
      ignoreErrors: true
    displayName: 'Copy files venv'
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        Remove-Item -Path '$(Build.SourcesDirectory)/backend' -Recurse -Force
    displayName: 'Remove folder backend'
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        Remove-Item -Path '$(Build.SourcesDirectory)/frontend' -Recurse -Force
    displayName: 'Remove folder frontend'
  - script: |
      python -m pip install python-decouple
    failOnStderr: false
    workingDirectory: E:/inetpub/wwwroot/uat.fadigitallab.deloitte.com.br/juca
    displayName: 'Install python-decouple'
  - script: |
      python start_server_service.py install
    workingDirectory: E:/inetpub/wwwroot/uat.fadigitallab.deloitte.com.br/juca
    displayName: 'Install Windows Service'
  - script: |
      python start_server_service.py stop
    workingDirectory: E:/inetpub/wwwroot/uat.fadigitallab.deloitte.com.br/juca
    failOnStderr: false
    displayName: 'Stop Windows Service'
  - script: |
      python start_server_service.py start
    workingDirectory: E:/inetpub/wwwroot/uat.fadigitallab.deloitte.com.br/juca
    displayName: 'Start Windows Service'